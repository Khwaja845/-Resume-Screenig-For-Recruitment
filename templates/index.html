<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .drop-zone {
            width: 100%;
            padding: 50px 20px;
            border: 2px dashed #38bdf8;
            margin: 30px auto;
            cursor: pointer;
            border-radius: 12px;
            position: relative;
            transition: 0.3s;
        }

        .drop-zone:hover {
            background: #1e293b;
        }

        .drop-zone.dragover {
            background: #1e293b;
            border-color: #0ea5e9;
        }

        .drop-zone p {
            margin: 5px 0;
        }

        .drop-zone input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            top: 0;
            left: 0;
            cursor: pointer;
        }

        #file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #38bdf8;
        }

        button {
            padding: 12px 25px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }

        .results {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        .badge {
            display: inline-block;
            background: #38bdf8;
            color: black;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Resume Screening</h1>

    <form method="POST" enctype="multipart/form-data">

        <div class="drop-zone" id="drop-zone">
            <p><strong>Drag & Drop Resume</strong></p>
            <p>or <span style="color:#38bdf8;">Click to Upload</span></p>

            <input type="file" name="resume" id="fileInput" accept=".pdf,.docx">
        </div>

        <p id="file-name"></p>

        <button type="submit">Analyze Resume</button>

    </form>

    {% if result %}
    <div class="results">
        <h2>Analysis Result</h2>

        <p><b>Score:</b> {{ result.score }}</p>

        <p><b>Matched Skills:</b></p>
        {% for skill in result.matched_skills %}
            <span class="badge">{{ skill }}</span>
        {% endfor %}

        <p><b>Education:</b></p>
        {% for edu in result.matched_education %}
            <span class="badge">{{ edu }}</span>
        {% endfor %}
    </div>
    {% endif %}

</div>

<script>
const dropZone = document.getElementById("drop-zone");
const input = document.getElementById("fileInput");
const fileName = document.getElementById("file-name");

// Drag over
dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

// Drag leave
dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

// Drop
dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    input.files = e.dataTransfer.files;
    dropZone.classList.remove("dragover");

    if (input.files.length > 0) {
        fileName.innerText = "Selected: " + input.files[0].name;
    }
});

// File select (click)
input.addEventListener("change", () => {
    if (input.files.length > 0) {
        fileName.innerText = "Selected: " + input.files[0].name;
    }
});
</script>

</body>
</html>
